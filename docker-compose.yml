services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - task-network

  backend:
    build:
      context: ./back
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskmanager
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Compose}
    depends_on:
      - mongodb
    networks:
      - task-network

  frontend:
    build:
      context: ./front
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - task-network

volumes:
  mongodb-data:

networks:
  task-network:
